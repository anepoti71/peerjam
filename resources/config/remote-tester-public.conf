# Remote machine tester/peer configuration against a signaling server hosted on your local machine.
# Replace PUBLIC_SERVER_IP with the public IP or DNS name of the local server machine.

peer.server_host = PUBLIC_SERVER_IP
peer.server_port = 11999
peer.candidate_exchange_port = 12000
peer.group = cross-site-test
peer.group_password =
peer.user = remote
peer.user_password =
peer.stun_host =
peer.stun_port = 3478
peer.udp_port = 12000

probe.duration_seconds = 8
probe.interval_ms = 10
probe.payload_bytes = 64
probe.warmup_packets = 20

path.reprobe_interval_ms = 3000
path.switch_margin_score = 1.0
path.switch_consecutive_wins = 2
predictor.enabled = true
predictor.shadow_mode = true
predictor.interval_ms = 150
predictor.risk_medium_threshold = 0.45
predictor.risk_high_threshold = 0.65
predictor.apply_cooldown_ms = 1200
predictor.max_sink_buffer_ms = 12

profile.in = remote-session-profile.json
profile.out = remote-session-profile.json

logging.enabled = true
logging.level = info
logging.sink = stderr
logging.file_path =

recommendation.sample_rate_hz = 48000
recommendation.aggressive.frame_samples = 64
recommendation.conservative.frame_samples = 128
recommendation.fallback.frame_samples = 128
recommendation.not_ready.loss_percent = 1.0
recommendation.not_ready.one_way_p95_ms = 30.0
recommendation.not_ready.jitter_p95_ms = 5.0
recommendation.aggressive_ready.loss_percent = 0.1
recommendation.aggressive_ready.one_way_p95_ms = 12.0
recommendation.aggressive_ready.jitter_p95_ms = 1.0
recommendation.conservative_ready.loss_percent = 0.5
recommendation.conservative_ready.one_way_p95_ms = 18.0
recommendation.conservative_ready.jitter_p95_ms = 2.5
recommendation.not_ready.buffer_min_ms = 8.0
recommendation.not_ready.buffer_max_ms = 20.0
recommendation.ready.buffer_min_ms = 5.0
recommendation.ready.buffer_max_ms = 8.0
recommendation.marginal.buffer_min_ms = 7.5
recommendation.marginal.buffer_max_ms = 12.0

audio.seconds = 30
audio.sample_rate_hz = 48000
audio.frame_samples = 128
audio.channels = 2
audio.source_buffer_ms = 3
audio.sink_buffer_ms = 5
audio.packetsize = 512
audio.resend_buffer_ms = 30
audio.resend_limit = 3
audio.resend_interval_ms = 3
audio.resend_max_frames = 4
audio.redundancy = 1
audio.dynamic_resampling = true
audio.codec = pcm
audio.device_io_enabled = true
audio.input_device_index = -1
audio.output_device_index = -1
audio.tone_hz = 440.0
audio.tone_level = 0.15
audio.source_id = 1
audio.sink_id = 1
